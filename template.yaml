AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless weather API backed by Open-Meteo

Parameters:
  GeocodingUrl:
    Type: String
    Default: https://geocoding-api.open-meteo.com/v1
  ForecastUrl:
    Type: String
    Default: https://api.open-meteo.com/v1
  TimeoutMs:
    Type: Number
    Default: 5000
    MinValue: 1
    MaxValue: 30000

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 256

Resources:
  WeatherFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Format: cjs
        Target: es2023
        Minify: true
        Sourcemap: false
        EntryPoints:
          - src/handler.ts
    Properties:
      CodeUri: .
      Handler: handler.handler
      Environment:
        Variables:
          GEOCODING_URL: !Ref GeocodingUrl
          FORECAST_URL: !Ref ForecastUrl
          TIMEOUT_MS: !Ref TimeoutMs
      Events:
        GetWeather:
          Type: HttpApi
          Properties:
            Path: /weather
            Method: GET
